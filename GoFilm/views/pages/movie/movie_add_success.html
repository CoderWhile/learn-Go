<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>网上影院 - 添加成功</title>
<link type="text/css" rel="stylesheet" href="/static/css/style.css" >
<style>
	.success-wrap {
		text-align: center;
		padding: 80px 0;
	}
	.success-icon {
		font-size: 72px;
		margin-bottom: 16px;
	}
	.success-wrap h1 {
		font-size: 28px;
		color: #333;
		margin-bottom: 12px;
	}
	.success-wrap p {
		font-size: 16px;
		color: #666;
		margin-bottom: 30px;
	}
	.success-wrap a {
		display: inline-block;
		padding: 12px 32px;
		margin: 0 10px;
		border-radius: 4px;
		font-size: 15px;
		font-weight: bold;
		text-decoration: none;
		transition: opacity 0.3s;
	}
	.btn-primary {
		background: linear-gradient(90deg, #8b6914, #b8860b);
		color: #fff;
	}
	.btn-secondary {
		background: #eee;
		color: #555;
	}
	.success-wrap a:hover {
		opacity: 0.85;
	}
</style>
</head>
<body>

	<div id="topbar">
		<div class="topbar-inner">
			<div class="topbar-left">
				<span class="logo-icon">🔧</span>
				<span class="logo-text">后台管理</span>
			</div>
			<div class="topbar-right">
				<a href="/manager" class="top-btn">电影管理</a>
				<a href="/main" class="top-btn">前台</a>
				<a href="/logout" class="top-btn">注销</a>
			</div>
		</div>
	</div>

	<div id="main">
		<div class="success-wrap">
			<div class="success-icon">✅</div>
			<h1>电影添加成功！</h1>
			<p>{{.Title}} 已成功添加到电影库</p>
			<div>
				<a href="/manager" class="btn-primary">返回电影管理</a>
				<a href="/pages/manager/movie_add.html" class="btn-secondary">继续添加</a>
			</div>
		</div>
	</div>

	<div id="bottom">
		<span>GoFilm网上影院 - 后台管理.Copyright &copy;2026</span>
	</div>
</body>
</html>
