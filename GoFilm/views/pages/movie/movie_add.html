<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>网上影院 - 添加电影</title>
<link type="text/css" rel="stylesheet" href="/static/css/style.css" >
<script src="/static/script/jquery-1.7.2.js"></script>
<style>
	.form-wrap {
		width: 700px;
		margin: 30px auto;
		background: #fff;
		border-radius: 8px;
		padding: 30px 40px;
		box-shadow: 0 2px 12px rgba(0,0,0,0.1);
	}
	.form-wrap h2 {
		font-size: 22px;
		margin-bottom: 24px;
		padding-bottom: 12px;
		border-bottom: 2px solid #b8860b;
		color: #333;
	}
	.form-row {
		display: flex;
		align-items: center;
		margin-bottom: 16px;
	}
	.form-row label {
		width: 90px;
		font-size: 14px;
		color: #555;
		font-weight: bold;
		flex-shrink: 0;
	}
	.form-row input, .form-row select, .form-row textarea {
		flex: 1;
		height: 38px;
		padding: 0 12px;
		border: 1px solid #ddd;
		border-radius: 4px;
		font-size: 14px;
		outline: none;
		transition: border-color 0.3s;
	}
	.form-row textarea {
		height: 80px;
		padding: 10px 12px;
		resize: vertical;
	}
	.form-row input:focus, .form-row select:focus, .form-row textarea:focus {
		border-color: #b8860b;
	}
	.form-row .hint {
		font-size: 12px;
		color: #999;
		margin-left: 8px;
	}
	.form-btn {
		text-align: center;
		margin-top: 24px;
	}
	.form-btn button {
		width: 200px;
		height: 42px;
		background: linear-gradient(90deg, #8b6914, #b8860b);
		color: #fff;
		border: none;
		border-radius: 4px;
		font-size: 16px;
		font-weight: bold;
		cursor: pointer;
		margin: 0 10px;
	}
	.form-btn button:hover { opacity: 0.85; }
	.form-btn .btn-cancel {
		background: #999;
	}
</style>
<script>
	$(function(){
		// 表单提交
		$("#submitBtn").click(function(){
			var title = $("#title").val().trim();
			if(title == ""){ alert("请输入电影名称！"); return false; }
			var genre = $("#genre").val().trim();
			if(genre == ""){ alert("请输入电影类型！"); return false; }
			var area = $("#area").val();
			if(area == ""){ alert("请选择地区！"); return false; }
			var intro = $("#intro").val().trim();
			if(intro == ""){ alert("请输入电影简介！"); return false; }
			var imagePath = $("#imagePath").val().trim();
			if(imagePath == ""){ alert("请输入海报地址！"); return false; }
			var duration = parseInt($("#duration").val());
			if(isNaN(duration) || duration <= 0){ alert("请输入正确的时长！"); return false; }
			var rating = parseFloat($("#rating").val());
			if(isNaN(rating) || rating < 0 || rating > 10){ alert("评分需在 0-10 之间！"); return false; }
		});
	});
</script>
</head>
<body>

	<div id="topbar">
		<div class="topbar-inner">
			<div class="topbar-left">
				<span class="logo-icon">🔧</span>
				<span class="logo-text">后台管理</span>
			</div>
			<div class="topbar-right">
				<a href="/manager" class="top-btn">电影管理</a>
				<a href="/main" class="top-btn">前台</a>
				<a href="/logout" class="top-btn">注销</a>
			</div>
		</div>
	</div>

	<div id="main">
		<div class="form-wrap">
			<h2>添加电影</h2>
			<form action="/addmovie" method="POST" enctype="multipart/form-data">
				<div class="form-row">
					<label>电影名称</label>
					<input type="text" id="title" name="title" placeholder="请输入电影名称" />
				</div>
				<div class="form-row">
					<label>电影类型</label>
					<select id="genre" name="genre">
						<option value="">请选择类型</option>
						<option value="动作">动作</option>
						<option value="喜剧">喜剧</option>
						<option value="爱情">爱情</option>
						<option value="动画">动画</option>
						<option value="剧情">剧情</option>
						<option value="悬疑">悬疑</option>
						<option value="惊悚">惊悚</option>
						<option value="科幻">科幻</option>
						<option value="战争">战争</option>
						<option value="冒险">冒险</option>
						<option value="警匪">警匪</option>
						<option value="家庭">家庭</option>
						<option value="音乐">音乐</option>
					</select>
				</div>
				<div class="form-row">
					<label>地区</label>
					<select id="area" name="area">
						<option value="">请选择地区</option>
						<option value="china">中国</option>
						<option value="america">美国</option>
						<option value="japan">日本</option>
						<option value="korea">韩国</option>
						<option value="europe">欧洲</option>
					</select>
				</div>
				<div class="form-row">
					<label>时长</label>
					<input type="number" id="duration" name="duration" placeholder="分钟" min="1" style="width:120px;flex:none;" />
					<span class="hint">单位：分钟</span>
				</div>
				<div class="form-row">
					<label>评分</label>
					<input type="number" id="rating" name="rating" placeholder="0.0" min="0" max="10" step="0.1" style="width:120px;flex:none;" />
					<span class="hint">范围 0-10，如 8.5</span>
				</div>
				<div class="form-row">
					<label>电影状态</label>
					<select id="status" name="status">
						<option value="未上映">未上映</option>
						<option value="上映中" selected>上映中</option>
						<option value="下架">下架</option>
					</select>
				</div>
				<div class="form-row">
					<label>海报地址</label>
					<input type="text" id="imagePath" name="imagePath" placeholder="图片 URL 或本地路径" />
				</div>
				<div class="form-row">
					<label>电影简介</label>
					<textarea id="intro" name="intro" placeholder="请输入电影简介"></textarea>
				</div>
				<div class="form-btn">
					<button type="submit" id="submitBtn">提交</button>
					<a href="/pages/admin/manager.html"><button type="button" class="btn-cancel">取消</button></a>
				</div>
			</form>
		</div>
	</div>

	<div id="bottom">
		<span>GoFilm网上影院 - 后台管理.Copyright &copy;2026</span>
	</div>
</body>
</html>
