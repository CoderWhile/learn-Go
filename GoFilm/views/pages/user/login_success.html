<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>网上影院 - 登录成功</title>
<link type="text/css" rel="stylesheet" href="/static/css/style.css" >
<style type="text/css">
	h1 {
		text-align: center;
		margin-top: 100px;
		font-size: 28px;
	}
	h1 a {
		color: #b8860b;
		text-decoration: none;
		font-size: 18px;
	}
	h1 a:hover {
		color: #c9a84c;
	}
	.success-icon {
		font-size: 64px;
		text-align: center;
		margin-bottom: 10px;
	}
	.success-msg {
		text-align: center;
		color: #666;
		font-size: 16px;
		margin-top: 12px;
	}
</style>
</head>
<body>

	<div id="topbar">
		<div class="topbar-inner">
			<div class="topbar-left">
				<span class="logo-icon">🎬</span>
				<span class="logo-text">网上影院</span>
			</div>
			<div class="topbar-right">
				<span class="welcome-text">欢迎 <span class="welcome-name">{{.Username}}</span> 登录</span>
				<a href="/getMyOrders" class="top-btn">我的订单</a>
				<a href="/logout" class="top-btn">注销</a>
			</div>
		</div>
	</div>

	<div id="main">
		<div class="success-icon">🎉</div>
		<h1>登录成功，欢迎回来！</h1>
		<p class="success-msg">您已成功登录网上影院，快去挑选心仪的电影吧！</p>
		<h1><a href="/main">→ 进入影院首页</a></h1>
	</div>

	<div id="bottom">
		<span>GoFilm网上影院.Copyright &copy;2026</span>
	</div>
</body>
</html>
