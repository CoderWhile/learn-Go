<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>网上影院 - 登录</title>
<link type="text/css" rel="stylesheet" href="/static/css/style.css" >
<script src="/static/script/jquery-1.7.2.js"></script>
<script>
	$(function(){
		$("#sub_btn").click(function(){
			var username = $("#username").val();
			if(username == ""){
				alert("用户名不能为空！");
				return false;
			}
			var password = $("#password").val();
			if(password == ""){
				alert("密码不能为空！");
				return false;
			}
		});
		// 显示后端返回的错误信息
		var msg = "{{.}}";
		if(msg && msg != ""){
			$("#msg").text(msg);
		}
	});
</script>
</head>
<body>

	<div id="login_header">
		<div class="login-logo">
			<span class="logo-icon">🎬</span>
			<span class="logo-text">网上影院</span>
		</div>
	</div>

	<div class="login_banner">
		<div id="l_content">
			<span class="login_word">欢迎登录</span>
			<p class="login_slogan">海量影片，尽在网上影院</p>
		</div>

		<div id="content">
			<div class="login_form">
				<div class="login_box">
					<div class="tit">
						<h1>用户登录</h1>
						<a href="/pages/user/regist.html">立即注册</a>
					</div>
					<div class="msg_cont">
						<b></b>
						<span class="errorMsg" id="msg">请输入用户名和密码</span>
					</div>
					<div class="form">
						<form action="/login" method="POST">
							<label>用户名称：</label>
							<input class="itxt" type="text" placeholder="请输入用户名" autocomplete="off" name="username" id="username" />
							<br /><br />
							<label>用户密码：</label>
							<input class="itxt" type="password" placeholder="请输入密码" autocomplete="off" name="password" id="password" />
							<br /><br /><br />
							<input type="submit" value="登录" id="sub_btn" />
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div id="bottom">
		<span>GoFilm网上影院.Copyright &copy;2026</span>
	</div>
</body>
</html>
